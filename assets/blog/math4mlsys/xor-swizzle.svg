<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" rx="30" fill="#f8fafc"/>
  <style>
    .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
    .label{font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
    .small{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
    .cell{font:700 24px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}
    .caption{font:600 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
  </style>

  <text x="60" y="60" class="title">Same logical tile, different bank mapping</text>

  <text x="250" y="118" class="label" text-anchor="middle">Naive mapping</text>
  <text x="850" y="118" class="label" text-anchor="middle">XOR swizzle: a Latin square of bank IDs</text>

  <!-- left grid -->
  <g transform="translate(90,155)">
    <rect x="0" y="0" width="320" height="320" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <g stroke="#e2e8f0" stroke-width="2">
      <line x1="80" y1="0" x2="80" y2="320"/><line x1="160" y1="0" x2="160" y2="320"/><line x1="240" y1="0" x2="240" y2="320"/>
      <line x1="0" y1="80" x2="320" y2="80"/><line x1="0" y1="160" x2="320" y2="160"/><line x1="0" y1="240" x2="320" y2="240"/>
    </g>
    <!-- highlight a column-wise logical access: all rows, same column -->
    <rect x="0" y="0" width="80" height="80" fill="#fee2e2"/>
    <rect x="0" y="80" width="80" height="80" fill="#fee2e2"/>
    <rect x="0" y="160" width="80" height="80" fill="#fee2e2"/>
    <rect x="0" y="240" width="80" height="80" fill="#fee2e2"/>
    <g class="cell">
      <text x="40" y="40">0</text><text x="120" y="40">1</text><text x="200" y="40">2</text><text x="280" y="40">3</text>
      <text x="40" y="120">0</text><text x="120" y="120">1</text><text x="200" y="120">2</text><text x="280" y="120">3</text>
      <text x="40" y="200">0</text><text x="120" y="200">1</text><text x="200" y="200">2</text><text x="280" y="200">3</text>
      <text x="40" y="280">0</text><text x="120" y="280">1</text><text x="200" y="280">2</text><text x="280" y="280">3</text>
    </g>
  </g>
  <text x="250" y="508" class="small" text-anchor="middle">An access pattern can repeatedly hit the same bank.</text>

  <!-- arrow -->
  <path d="M470 315 C535 315, 555 315, 620 315" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <path d="M605 300 L625 315 L605 330" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="548" y="282" class="small" text-anchor="middle">remap</text>

  <!-- right grid -->
  <g transform="translate(690,155)">
    <rect x="0" y="0" width="320" height="320" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <g stroke="#e2e8f0" stroke-width="2">
      <line x1="80" y1="0" x2="80" y2="320"/><line x1="160" y1="0" x2="160" y2="320"/><line x1="240" y1="0" x2="240" y2="320"/>
      <line x1="0" y1="80" x2="320" y2="80"/><line x1="0" y1="160" x2="320" y2="160"/><line x1="0" y1="240" x2="320" y2="240"/>
    </g>
    <!-- same logical column access, now maps to four different banks -->
    <rect x="0" y="0" width="80" height="80" fill="#dcfce7"/>
    <rect x="0" y="80" width="80" height="80" fill="#dbeafe"/>
    <rect x="0" y="160" width="80" height="80" fill="#fef3c7"/>
    <rect x="0" y="240" width="80" height="80" fill="#f3e8ff"/>
    <g class="cell">
      <text x="40" y="40">0</text><text x="120" y="40">1</text><text x="200" y="40">2</text><text x="280" y="40">3</text>
      <text x="40" y="120">1</text><text x="120" y="120">0</text><text x="200" y="120">3</text><text x="280" y="120">2</text>
      <text x="40" y="200">2</text><text x="120" y="200">3</text><text x="200" y="200">0</text><text x="280" y="200">1</text>
      <text x="40" y="280">3</text><text x="120" y="280">2</text><text x="200" y="280">1</text><text x="280" y="280">0</text>
    </g>
  </g>
  <text x="850" y="508" class="small" text-anchor="middle">Every bank ID occurs once in each row and column.</text>

  <rect x="178" y="548" width="844" height="45" rx="12" fill="#eef2ff"/>
  <text x="600" y="577" class="caption" text-anchor="middle">Group cancellation makes the XOR table a Latin square.</text>
</svg>
