<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">A 32 by 8 CUDA block transposes a 32 by 32 tile in two phases</title>
  <desc id="desc">Eight warps load four groups of rows into shared memory, synchronize, then turn a shared-memory column read into a contiguous output row write.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#697681"/>
    </marker>
    <pattern id="grid" width="9.375" height="7" patternUnits="userSpaceOnUse">
      <path d="M 9.375 0 L 0 0 0 7" fill="none" stroke="#ffffff" stroke-opacity=".66" stroke-width=".8"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1f2328" flood-opacity=".07"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #2f3337; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .hero { font-size: 28px; font-weight: 750; fill: #1f2328; }
      .subtitle { font-size: 17px; fill: #66707a; }
      .heading { font-size: 23px; font-weight: 700; fill: #1f2328; }
      .formula { font-size: 16px; fill: #56616b; }
      .action { font-size: 19px; font-weight: 700; fill: #34404a; }
      .round { font-size: 16px; font-weight: 700; fill: #3e4a54; }
      .accent-label { font-size: 17px; font-weight: 750; fill: #a64e27; }
      .step { fill: #edf5eb; stroke: #b9cfb3; stroke-width: 1.5; }
      .step-text { font-size: 18px; font-weight: 800; fill: #476746; }
      .card { fill: #ffffff; stroke: #d8dde3; stroke-width: 1.5; }
      .band0 { fill: #cfe4fa; }
      .band1 { fill: #d9d2f2; }
      .band2 { fill: #d7ecd2; }
      .band3 { fill: #f8dfbc; }
      .tile-outline { fill: none; stroke: #53606b; stroke-width: 1.7; }
      .arrow { fill: none; stroke: #697681; stroke-width: 2.5; marker-end: url(#arrow); }
      .accent { fill: none; stroke: #d96a35; stroke-width: 4; }
    </style>
  </defs>

  <rect width="1200" height="860" rx="18" fill="#fbfcfd"/>
  <text class="hero" x="600" y="50" text-anchor="middle">32 × 8 threads move one 32 × 32 tile</text>
  <text class="subtitle" x="600" y="79" text-anchor="middle">8 warps × 4 rounds · each warp spans one 32-value row</text>

  <!-- Phase 1: rows in HBM remain rows in shared memory. -->
  <g filter="url(#shadow)">
    <rect class="card" x="62" y="112" width="422" height="292" rx="12"/>
    <rect class="card" x="716" y="112" width="422" height="292" rx="12"/>
  </g>
  <text class="heading" x="92" y="151">Input · HBM</text>
  <text class="heading" x="746" y="151">CTA shared memory</text>

  <g aria-label="Input tile split into four rounds">
    <rect class="band0" x="122" y="174" width="300" height="56"/>
    <rect class="band1" x="122" y="230" width="300" height="56"/>
    <rect class="band2" x="122" y="286" width="300" height="56"/>
    <rect class="band3" x="122" y="342" width="300" height="56"/>
    <rect x="122" y="174" width="300" height="224" fill="url(#grid)"/>
    <rect class="tile-outline" x="122" y="174" width="300" height="224"/>
    <text class="round mono" x="137" y="207">j=0</text>
    <text class="round mono" x="137" y="263">j=8</text>
    <text class="round mono" x="137" y="319">j=16</text>
    <text class="round mono" x="137" y="375">j=24</text>
  </g>

  <g aria-label="Shared tile after row writes">
    <rect class="band0" x="777" y="174" width="300" height="56"/>
    <rect class="band1" x="777" y="230" width="300" height="56"/>
    <rect class="band2" x="777" y="286" width="300" height="56"/>
    <rect class="band3" x="777" y="342" width="300" height="56"/>
    <rect x="777" y="174" width="300" height="224" fill="url(#grid)"/>
    <rect class="tile-outline" x="777" y="174" width="300" height="224"/>
  </g>

  <g aria-label="Coalesced row load">
    <circle class="step" cx="540" cy="232" r="20"/>
    <text class="step-text" x="540" y="239" text-anchor="middle">1</text>
    <text class="action" x="600" y="210" text-anchor="middle">load rows</text>
    <path class="arrow" d="M 505 258 L 695 258"/>
    <text class="formula mono" x="600" y="290" text-anchor="middle">tile[ty+j, tx]</text>
  </g>

  <!-- The barrier is the only transition between the two views. -->
  <line x1="62" y1="447" x2="1138" y2="447" stroke="#d8dde3" stroke-width="1.5"/>
  <rect x="455" y="420" width="290" height="54" rx="27" fill="#ffffff" stroke="#bdc7d0" stroke-width="1.7"/>
  <text class="action mono" x="600" y="454" text-anchor="middle">sync_threads()</text>

  <!-- Phase 2: a column in shared memory becomes a row in output. -->
  <g filter="url(#shadow)">
    <rect class="card" x="62" y="506" width="422" height="292" rx="12"/>
    <rect class="card" x="716" y="506" width="422" height="292" rx="12"/>
  </g>
  <text class="heading" x="92" y="545">Shared · read columns</text>
  <text class="heading" x="746" y="545">Output · HBM rows</text>

  <g aria-label="Shared tile split into four column groups">
    <rect class="band0" x="122" y="568" width="75" height="224"/>
    <rect class="band1" x="197" y="568" width="75" height="224"/>
    <rect class="band2" x="272" y="568" width="75" height="224"/>
    <rect class="band3" x="347" y="568" width="75" height="224"/>
    <rect x="122" y="568" width="300" height="224" fill="url(#grid)"/>
    <rect class="tile-outline" x="122" y="568" width="300" height="224"/>
    <rect class="accent" x="215.75" y="568" width="9.375" height="224"/>
    <text class="accent-label" x="272" y="594">one warp</text>
  </g>

  <g aria-label="Output tile split into four row groups">
    <rect class="band0" x="777" y="568" width="300" height="56"/>
    <rect class="band1" x="777" y="624" width="300" height="56"/>
    <rect class="band2" x="777" y="680" width="300" height="56"/>
    <rect class="band3" x="777" y="736" width="300" height="56"/>
    <rect x="777" y="568" width="300" height="224" fill="url(#grid)"/>
    <rect class="tile-outline" x="777" y="568" width="300" height="224"/>
    <rect class="accent" x="777" y="638" width="300" height="7"/>
    <text class="accent-label" x="927" y="670" text-anchor="middle">32 adjacent stores</text>
  </g>

  <g aria-label="Column to row mapping">
    <circle class="step" cx="540" cy="625" r="20"/>
    <text class="step-text" x="540" y="632" text-anchor="middle">2</text>
    <text class="action" x="600" y="603" text-anchor="middle">column → row</text>
    <path class="arrow" d="M 505 651 L 695 651"/>
    <text class="formula mono" x="600" y="683" text-anchor="middle">tile[tx, ty+j]</text>
  </g>
</svg>
